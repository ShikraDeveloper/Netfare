<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Netfare — Invoicing & Books</title>
  <meta name="description" content="Netfare: invoicing and double-entry books for non-IATA travel agencies. A ShikraGroup brand.">
  <meta name="theme-color" content="#f3f6fa">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/brand/netfare-icon.svg" type="image/svg+xml">
  <link rel="icon" href="/brand/netfare-icon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="/brand/netfare-icon-16.png" sizes="16x16" type="image/png">
  <link rel="apple-touch-icon" href="/brand/netfare-icon-180.png">
  <script src="/js/theme-boot.js"></script>
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/theme.css">
</head>
<body>
  <a class="skip-link" href="#view" id="skip-link">Skip to content</a>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#/dashboard">
        <img class="brand-logo" src="/brand/netfare-logo-notag-white.svg" alt="Netfare" width="138" height="48">
        <span class="brand-tagline">Invoicing &amp; Books</span>
      </a>
      <button type="button" class="sidebar-close" id="sidebar-close" aria-label="Close menu" aria-controls="sidebar">
        <svg class="burger-open" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        <svg class="burger-close" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
      <div class="side-tools" id="side-tools"></div>
      <nav class="nav" id="main-nav" aria-label="Main navigation"></nav>
      <div class="sidebar-foot" id="sidebar-foot"></div>
    </aside>
    <div class="sidebar-scrim" id="sidebar-scrim"></div>

    <div class="main">
      <header class="topnav no-print" id="top-nav"></header>
      <header class="topbar">
        <button type="button" class="icon-btn menu-btn" id="menu-btn" aria-label="Toggle navigation" aria-controls="sidebar" aria-expanded="true">
          <svg class="burger" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false">
            <line class="burger-top" x1="4" y1="6" x2="20" y2="6"/>
            <line class="burger-mid" x1="4" y1="12" x2="20" y2="12"/>
            <line class="burger-bottom" x1="4" y1="18" x2="20" y2="18"/>
          </svg>
        </button>
        <div class="page-heading">
          <h1 id="page-title">Dashboard</h1>
          <p id="page-subtitle"></p>
        </div>
        <div class="page-actions" id="page-actions"></div>
        <div class="topbar-tools" id="topbar-tools"></div>
      </header>

      <main class="view" id="view" tabindex="-1">
        <div class="loading"><div class="spinner"></div><span>Opening your books…</span></div>
      </main>
    </div>
  </div>

  <div class="toast-root" id="toast-root" role="status" aria-live="polite" aria-atomic="true"></div>
  <script src="/vendor/chart.umd.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
