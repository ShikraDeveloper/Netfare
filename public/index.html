<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ledgerly — Invoicing & Accounting</title>
  <meta name="description" content="A local-first invoicing and double-entry accounting system.">
  <meta name="theme-color" content="#f7f1e5">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230b1b2e'/%3E%3Ctext x='32' y='45' font-size='36' font-family='Arial' font-weight='bold' fill='%23f7b520' text-anchor='middle'%3EL%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    // Restore the theme before the first paint so dark mode never flashes light.
    try {
      const savedTheme = localStorage.getItem('ledgerly.theme');
      const theme = savedTheme === 'dark' ? 'dark' : 'light';
      document.documentElement.dataset.theme = theme;
      document.documentElement.style.colorScheme = theme;
      const themeMeta = document.querySelector('meta[name="theme-color"]');
      if (themeMeta) themeMeta.setAttribute('content', theme === 'dark' ? '#08121f' : '#f7f1e5');
    } catch (error) {
      document.documentElement.dataset.theme = 'light';
    }
    // Restore the desktop sidebar state before the first paint so it does not animate in.
    try {
      if (localStorage.getItem('ledgerly.navCollapsed') === '1') {
        document.documentElement.classList.add('nav-collapsed');
      }
    } catch (error) { /* storage unavailable */ }
  </script>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/theme.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#/dashboard">
        <span class="brand-mark">L</span>
        <span class="brand-text">
          <strong>Ledgerly</strong>
          <span>Invoicing &amp; books</span>
        </span>
      </a>
      <nav class="nav" id="main-nav" aria-label="Main navigation"></nav>
      <div class="sidebar-foot" id="sidebar-foot"></div>
    </aside>
    <div class="sidebar-scrim" id="sidebar-scrim"></div>

    <div class="main">
      <header class="topbar">
        <button type="button" class="icon-btn menu-btn" id="menu-btn" aria-label="Toggle navigation" aria-controls="sidebar" aria-expanded="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="page-heading">
          <h1 id="page-title">Dashboard</h1>
          <p id="page-subtitle"></p>
        </div>
        <div class="page-actions" id="page-actions"></div>
      </header>

      <main class="view" id="view">
        <div class="loading"><div class="spinner"></div><span>Opening your books…</span></div>
      </main>
    </div>
  </div>

  <div class="toast-root" id="toast-root" aria-live="polite"></div>
  <script src="/vendor/chart.umd.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
